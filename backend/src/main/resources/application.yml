spring:
  application:
    name: fulfillops-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fulfillops}
    username: ${DB_USERNAME:fulfillops}
    password: ${DB_PASSWORD:fulfillops_local}
  flyway:
    clean-disabled: true
    validate-migration-naming: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
