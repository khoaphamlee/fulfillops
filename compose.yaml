services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-fulfillops}
      POSTGRES_USER: ${DB_USERNAME:-fulfillops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fulfillops_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - fulfillops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  fulfillops_postgres_data:
